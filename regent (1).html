<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regent — Personal Finance Dashboard</title>
    <meta
      name="theme-color"
      content="#0d1f17"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Regent" />
    <meta
      name="description"
      content="Your private, offline-capable finance dashboard with editable APY inputs. Data saves in your browser."
    />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link

      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23178A50'/%3E%3Cpath d='M7 22v-9l5 4.5L16 9l4 8.5L25 13v9Z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
/* ============ Design tokens ============ */
:root,
[data-theme='light'] {
  /* Surfaces — green-tinged neutrals */
  --color-bg: #f6f8f7;
  --color-surface: #ffffff;
  --color-surface-2: #f0f4f2;
  --color-surface-offset: #e8efeb;
  --color-divider: #e5eae7;
  --color-border: #dbe3de;

  /* Text */
  --color-text: #16261f;
  --color-text-muted: #57685f;
  --color-text-faint: #8fa199;

  /* Primary — regent green */
  --color-primary: #178a50;
  --color-primary-hover: #106b3d;
  --color-primary-active: #0b5330;
  --color-primary-highlight: #dcf0e5;
  --color-primary-soft: #eaf6ef;

  /* Negative — clay */
  --color-negative: #c04a2b;
  --color-negative-hover: #9a3a20;
  --color-negative-soft: #faece7;
  --color-negative-highlight: #f4ddd4;

  --color-gold: #b98a1c;
  --color-gold-soft: #f9f1dd;

  --color-blue: #2563a8;
  --color-blue-soft: #e4edf8;

  --radius-sm: 0.375rem;
  --radius-md: 0.625rem;
  --radius-lg: 0.875rem;
  --radius-xl: 1.25rem;

  --transition-interactive: 160ms cubic-bezier(0.16, 1, 0.3, 1);

  --shadow-sm: 0 1px 2px rgba(22, 38, 31, 0.06);
  --shadow-md: 0 4px 14px rgba(22, 38, 31, 0.08);
  --shadow-lg: 0 18px 48px rgba(22, 38, 31, 0.18);

  --sidebar-bg: #ffffff;

  /* Type scale */
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.8125rem);
  --text-sm: clamp(0.8125rem, 0.78rem + 0.2vw, 0.9375rem);
  --text-base: clamp(0.9375rem, 0.9rem + 0.25vw, 1.0625rem);
  --text-lg: clamp(1.0625rem, 0.98rem + 0.55vw, 1.375rem);
  --text-xl: clamp(1.375rem, 1.2rem + 1.1vw, 2.25rem);

  /* Spacing */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  --font-body: 'General Sans', -apple-system, 'Segoe UI', sans-serif;
}

[data-theme='dark'] {
  --color-bg: #0e1511;
  --color-surface: #131b16;
  --color-surface-2: #17211b;
  --color-surface-offset: #1c2721;
  --color-divider: #1f2b24;
  --color-border: #27352d;

  --color-text: #e4ebe6;
  --color-text-muted: #96a69d;
  --color-text-faint: #5f7066;

  --color-primary: #46bd7e;
  --color-primary-hover: #58cc8c;
  --color-primary-active: #2f9763;
  --color-primary-highlight: #16301f;
  --color-primary-soft: #17281e;

  --color-negative: #e2693f;
  --color-negative-hover: #ef7f57;
  --color-negative-soft: #2c1a12;
  --color-negative-highlight: #3a221a;

  --color-gold: #d9a83c;
  --color-gold-soft: #2a2110;

  --color-blue: #5c9ddd;
  --color-blue-soft: #12212f;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.55);

  --sidebar-bg: #131b16;
}

/* ============ Base ============ */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100dvh;
  line-height: 1.55;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background-color: var(--color-bg);
}

button {
  cursor: pointer;
  background: none;
  border: none;
  color: inherit;
  font: inherit;
}

ul[role='list'],
ol[role='list'] {
  list-style: none;
}

input,
select {
  font: inherit;
  color: inherit;
}

.num {
  font-variant-numeric: tabular-nums lining-nums;
}

:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

/* ============ App shell ============ */
.app {
  display: grid;
  grid-template-columns: 236px 1fr;
  height: 100dvh;
  overflow: hidden;
}

.sidebar {
  grid-row: 1;
  display: flex;
  flex-direction: column;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--color-divider);
  padding: var(--space-5) var(--space-4);
  gap: var(--space-6);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-2);
}

.brand-mark {
  display: inline-flex;
  color: var(--color-primary);
}

.brand-name {
  font-weight: 700;
  font-size: var(--text-lg);
  letter-spacing: -0.01em;
}

.sidebar nav ul {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  padding: var(--space-3) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-weight: 500;
  font-size: var(--text-sm);
  text-align: left;
  transition:
    background var(--transition-interactive),
    color var(--transition-interactive);
}

.nav-item svg {
  width: 20px;
  height: 20px;
  flex: none;
}

.nav-item:hover {
  background: var(--color-surface-2);
  color: var(--color-text);
}

.nav-item.active {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 600;
}

[data-theme='dark'] .nav-item.active {
  background: var(--color-primary-highlight);
}

.nav-chip {
  margin-left: auto;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-faint);
  background: var(--color-surface-2);
  border-radius: var(--radius-full, 9999px);
  padding: 0 var(--space-2);
}

.sidebar-foot {
  margin-top: auto;
  padding-top: var(--space-6);
}

.user {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-2);
}

.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
}

.user-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}

.user-name {
  font-weight: 600;
  font-size: var(--text-sm);
}

.user-plan {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}

.mobilebar,
.bottomnav {
  display: none;
}

/* ============ Main ============ */
main {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--space-8) var(--space-10) var(--space-12);
}

@media (max-width: 900px) {
  main {
    padding: var(--space-5) var(--space-4) calc(var(--space-16) + var(--space-6));
  }
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
  margin-bottom: var(--space-8);
}

.greeting {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.greeting-sub {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-top: var(--space-2);
  color: var(--color-text-muted);
  font-size: var(--text-sm);
}

.badge-demo {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-gold);
  background: var(--color-gold-soft);
  border-radius: 9999px;
  padding: var(--space-1) var(--space-3);
}

.head-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-3);
}

.save-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
  border: 1px solid var(--color-divider);
  border-radius: 9999px;
  padding: var(--space-2) var(--space-4);
  white-space: nowrap;
  transition:
    background var(--transition-interactive),
    color var(--transition-interactive),
    border-color var(--transition-interactive);
}

.save-pill::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-text-faint);
}

.save-pill.saving::before {
  background: var(--color-gold);
}

.save-pill.saved {
  color: var(--color-primary);
  border-color: color-mix(in oklab, var(--color-primary) 30%, transparent);
}

.save-pill.saved::before {
  background: var(--color-primary);
}

.save-pill.error {
  color: var(--color-negative);
  border-color: color-mix(in oklab, var(--color-negative) 30%, transparent);
}

.save-pill.error::before {
  background: var(--color-negative);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 600;
  transition:
    background var(--transition-interactive),
    border-color var(--transition-interactive),
    color var(--transition-interactive),
    box-shadow var(--transition-interactive);
}

.btn svg {
  width: 16px;
  height: 16px;
}

.btn.primary {
  background: var(--color-primary);
  color: #fff;
  box-shadow: var(--shadow-sm);
}

.btn.primary:hover {
  background: var(--color-primary-hover);
}

.btn.ghost {
  border: 1px solid var(--color-border);
  color: var(--color-text-muted);
  background: var(--color-surface);
}

.btn.ghost:hover {
  color: var(--color-text);
  border-color: var(--color-text-faint);
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  transition:
    background var(--transition-interactive),
    color var(--transition-interactive);
}

.icon-btn:hover {
  color: var(--color-text);
  background: var(--color-surface-2);
}

/* ============ Cards & grids ============ */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-6);
}

.card + .card {
  margin-top: 0;
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-5);
}

.card-title {
  font-size: var(--text-base);
  font-weight: 600;
}

.card-sub {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-top: var(--space-1);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-5);
  margin-bottom: var(--space-5);
}

.dash-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: var(--space-5);
  margin-bottom: var(--space-5);
}

.dash-row-2 {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: var(--space-5);
  margin-bottom: var(--space-5);
}

@media (max-width: 1100px) {
  .dash-grid,
  .dash-row-2 {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 900px) {
  .kpi-grid {
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }
}

/* KPI values */
.kpi-label {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.kpi-value {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-top: var(--space-2);
}

.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-xs);
  font-weight: 600;
  margin-top: var(--space-2);
}

.kpi-delta.up {
  color: var(--color-primary);
}

.kpi-delta.down {
  color: var(--color-negative);
}

.kpi-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-md);
}

.kpi-icon.green {
  background: var(--color-primary-soft);
  color: var(--color-primary);
}

.kpi-icon.red {
  background: var(--color-negative-soft);
  color: var(--color-negative);
}

.kpi-icon.blue {
  background: var(--color-blue-soft);
  color: var(--color-blue);
}

.kpi-icon.slate { background: color-mix(in oklab, var(--color-text-muted) 14%, transparent); color: var(--color-text-muted); }
.kpi-icon.gold {
  background: var(--color-gold-soft);
  color: var(--color-gold);
}

.kpi-icon svg {
  width: 18px;
  height: 18px;
}

/* Chart */
.chart-wrap {
  margin-top: var(--space-5);
}

.chart-svg {
  width: 100%;
  height: auto;
  display: block;
}

.chart-legend {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  margin-top: var(--space-3);
}

/* Snapshot rows */
.snap-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) 0;
}

.snap-row + .snap-row {
  border-top: 1px solid var(--color-divider);
}

.snap-row .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}

.snap-name {
  font-size: var(--text-sm);
  font-weight: 500;
}

.snap-count {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}

.snap-balance {
  margin-left: auto;
  font-weight: 600;
  font-size: var(--text-sm);
}

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  color: var(--color-primary);
  font-size: var(--text-sm);
  font-weight: 600;
  padding: var(--space-2) 0;
}

.link-btn:hover {
  color: var(--color-primary-hover);
}

/* Interest outlook */
.outlook-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-4);
}

.outlook-item {
  background: var(--color-surface-2);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}

.outlook-item .o-label {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-muted);
}

.outlook-item .o-value {
  font-size: var(--text-lg);
  font-weight: 700;
  margin-top: var(--space-1);
  letter-spacing: -0.01em;
}

.o-value.pos {
  color: var(--color-primary);
}

.o-value.neg {
  color: var(--color-negative);
}

/* Transactions */
.tx-list {
  display: flex;
  flex-direction: column;
}

.tx-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) 0;
}

.tx-row + .tx-row {
  border-top: 1px solid var(--color-divider);
}

.tx-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full, 9999px);
  flex: none;
}

.tx-icon svg {
  width: 18px;
  height: 18px;
}

.tx-name {
  font-weight: 600;
  font-size: var(--text-sm);
}

.tx-meta {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  margin-top: 2px;
}

.tx-cat {
  margin-left: auto;
  font-size: var(--text-xs);
  font-weight: 600;
  padding: var(--space-1) var(--space-3);
  border-radius: 9999px;
  white-space: nowrap;
}

.tx-amount {
  font-weight: 600;
  font-size: var(--text-sm);
  white-space: nowrap;
}

.tx-amount.in {
  color: var(--color-primary);
}

/* ============ Accounts view ============ */
.summary-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

@media (max-width: 900px) {
  .summary-strip {
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-4);
  }
}

.summary-card {
  background: var(--color-surface);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
}

.summary-card .s-label {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.summary-card .s-value {
  font-size: var(--text-lg);
  font-weight: 700;
  margin-top: var(--space-2);
  letter-spacing: -0.01em;
}

.s-value.pos {
  color: var(--color-primary);
}

.s-value.neg {
  color: var(--color-negative);
}

.s-foot {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  margin-top: var(--space-1);
}

.account-group {
  margin-bottom: var(--space-6);
}

.group-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-2) var(--space-3);
}

.group-title {
  font-size: var(--text-sm);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
}

.group-sub {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}

.group-sub .pos {
  color: var(--color-primary);
  font-weight: 600;
}

.group-sub .neg {
  color: var(--color-negative);
  font-weight: 600;
}

.rows {
  background: var(--color-surface);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.row-col-head {
  display: grid;
  grid-template-columns: 44px minmax(140px, 1fr) 120px 130px 88px 120px 40px;
  gap: var(--space-3);
  align-items: center;
  padding: var(--space-3) var(--space-5);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-text-faint);
  border-bottom: 1px solid var(--color-divider);
  background: var(--color-surface-2);
}

.account-row {
  display: grid;
  grid-template-columns: 44px minmax(140px, 1fr) 120px 130px 88px 120px 40px;
  gap: var(--space-3);
  align-items: center;
  padding: var(--space-4) var(--space-5);
  transition: background var(--transition-interactive);
}

.row-meta {

    <script>
/* ============================================================
   Regent — Monarch-inspired finance dashboard prototype
   Sample data only. Editable APY/APR per account.
   ============================================================ */

/* ---------- State ---------- */
const state = {
  view: 'dashboard',
  userName: '',
  accounts: [],
  goals: [],
};

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const viewRoot = $('#view-root');

/* ---------- Persistence ----------
   deploy_website rewrites this placeholder to the backend proxy path;
   when running locally (no rewrite) fall back to the dev server. */
const STORAGE_KEY = 'regent-finance-v1';

let saveStatus = 'idle';
const saveStatusText = {
  idle: 'All changes saved',
  saving: 'Saving…',
  saved: 'Saved',
  error: 'Offline — changes stay on this page',
};

function setSaveStatus(s) {
  saveStatus = s;
  const el = document.getElementById('save-status');
  if (el) {
    el.textContent = saveStatusText[s];
    el.className = 'save-pill ' + s;
    el.setAttribute('data-state', s);
  }
}

let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setSaveStatus('saving');
  saveTimer = setTimeout(doSave, 600);
}

async function doSave() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      accounts: state.accounts,
      goals: state.goals,
      theme: document.documentElement.getAttribute('data-theme'),
      userName: state.userName,
    }));
    setSaveStatus('saved');
  } catch {
    setSaveStatus('error');
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.accounts)) {
        state.accounts = data.accounts.map((a) => ({
          ...a,
          inNetWorth: a.inNetWorth !== false,
          liquidity: a.liquidity && LIQ[a.liquidity] ? a.liquidity : (LIQ_DEFAULT[a.type] || a.liquidity),
        }));
      }
      if (typeof data.userName === 'string') state.userName = data.userName.trim().slice(0, 40);
      if (Array.isArray(data.goals)) state.goals = data.goals.slice(0, 50);
      if (data.theme === 'dark' || data.theme === 'light') {
        document.documentElement.setAttribute('data-theme', data.theme);
      }
    }
    setSaveStatus('idle');
  } catch {
    setSaveStatus('error');
  }
}

/* ---------- Backup: export / import ---------- */
function exportData() {
  const payload = {
    app: 'regent',
    version: 1,
    exported: new Date().toISOString(),
    accounts: state.accounts,
    goals: state.goals,
    theme: document.documentElement.getAttribute('data-theme'),
    userName: state.userName,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'regent-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.accounts;
    if (!Array.isArray(list) || !list.length) throw new Error('no accounts');
    const types = ['cash', 'receivable', 'card', 'inv', 'loan', 'crypto', 'property', 'other'];
    state.accounts = list.slice(0, 100).map((acc, i) => {
      const type = types.includes(acc.type) ? acc.type : 'cash';
      const bal = Number(acc.balance);
      const rateEditable = type === 'cash' || type === 'card' || type === 'loan';
      return {
        id: typeof acc.id === 'string' && acc.id ? acc.id : 'acc-' + Date.now() + '-' + i,
        name: String(acc.name || 'Account'),
        institution: String(acc.institution || ''),
        type,
        balance: Number.isFinite(bal) ? Math.round(bal * 100) / 100 : 0,
        rate: rateEditable ? clampRate(Number(acc.rate) || 0) : null,
        liquidity: type === 'card' || type === 'loan' ? undefined : (LIQ[acc.liquidity] ? acc.liquidity : LIQ_DEFAULT[type]),
        payment: type === 'card' || type === 'loan' ? Math.max(0, Number(acc.payment) || 0) : undefined,
        inNetWorth: acc.inNetWorth !== false,
      };
    });
    if (Array.isArray(data.goals)) {
      state.goals = data.goals.slice(0, 50).map((g, i) => ({
        id: typeof g.id === 'string' && g.id ? g.id : 'goal-' + Date.now() + '-' + i,
        name: String(g.name || 'Goal'),
        target: Math.max(0, Number(g.target) || 0),
        saved: Math.max(0, Number(g.saved) || 0),
        monthly: Math.max(0, Number(g.monthly) || 0),
      }));
    }
    if (typeof data.userName === 'string') {
      state.userName = data.userName.trim().slice(0, 40);
      applyUserName();
    }
    if (data.theme === 'dark' || data.theme === 'light') {
      document.documentElement.setAttribute('data-theme', data.theme);
    }
    render();
    updateNavCount();
    scheduleSave();
  } catch {
    alert('That file could not be read as a Regent backup.');
  }
  const input = document.getElementById('import-file');
  if (input) input.value = '';
}

const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const fmtMoney = (n) => money.format(n);
const fmtSigned = (n) => (n >= 0 ? '+' : '−') + money.format(Math.abs(n));
const clampRate = (r) => Math.min(30, Math.max(0, r));

const GROUPS = [
  { type: 'cash', title: 'Cash & Savings', color: 'green' },
  { type: 'receivable', title: 'Receivables', color: 'blue' },
  { type: 'card', title: 'Credit Cards', color: 'red' },
  { type: 'inv', title: 'Investments', color: 'blue' },
  { type: 'crypto', title: 'Crypto', color: 'gold' },
  { type: 'property', title: 'Property & Home', color: 'blue' },
  { type: 'loan', title: 'Loans & Mortgages', color: 'gold' },
  { type: 'other', title: 'Other Assets', color: 'slate' },
];

/* Liquidity — how quickly the money can be accessed */
const LIQ = { instant: 'Instant', days: '2–5 days', slow: '1+ week', pending: 'Pending', locked: 'Locked' };
const LIQ_ORDER = ['instant', 'days', 'slow', 'pending', 'locked'];
const hasLiquidity = (a) => a.type !== 'card' && a.type !== 'loan';
const liqOf = (a) =>
  LIQ[a.liquidity]
    ? a.liquidity
    : ({ cash: 'instant', receivable: 'pending', inv: 'days', crypto: 'days', property: 'locked', other: 'locked' }[a.type] || 'locked');
const LIQ_DEFAULT = { cash: 'instant', receivable: 'pending', inv: 'days', crypto: 'days', property: 'locked', other: 'locked' };

const rateLabel = (a) => (a.type === 'cash' ? 'APY' : 'APR');
const isRateEditable = (a) => a.type === 'cash' || a.type === 'card' || a.type === 'loan';
const isInNetWorth = (a) => a.inNetWorth !== false; // default true

const annualInterest = (a) =>
  isRateEditable(a) ? (a.type === 'cash' ? a.balance * (a.rate / 100) : Math.abs(a.balance) * (a.rate / 100)) : 0;

const totals = () => {
  let netWorth = 0, cash = 0, debt = 0, inv = 0, earned = 0, cost = 0, liquid = 0, assets = 0, receivables = 0;
  for (const a of state.accounts) {
    const inNW = isInNetWorth(a);
    if (inNW) netWorth += a.balance;
    if (a.type === 'cash') {
      cash += a.balance;
      earned += annualInterest(a);
      if (liqOf(a) === 'instant' || liqOf(a) === 'days') liquid += a.balance;
    }
    if (a.type === 'receivable') {
      receivables += a.balance;
      if (liqOf(a) === 'instant' || liqOf(a) === 'days') liquid += a.balance;
    }
    if (a.type === 'inv' || a.type === 'crypto' || a.type === 'property' || a.type === 'other') inv += a.balance;
    if (a.type === 'card' || a.type === 'loan') { debt += a.balance; cost += annualInterest(a); }
    if (a.balance > 0 && inNW) assets += a.balance;
  }
  const debtAbs = Math.abs(debt);
  const debtToAsset = assets > 0 ? debtAbs / assets : (debtAbs > 0 ? Infinity : 0);
  const liquidToDebt = debtAbs > 0 ? liquid / debtAbs : (liquid > 0 ? Infinity : 0);
  return { netWorth, cash, inv, debt, earned, cost, liquid, receivables, assets, debtToAsset, liquidToDebt, netInterest: earned - cost };
};

/* ---------- Debt payoff & goals ---------- */
const defaultPayment = (bal, apr) => Math.max(25, Math.round(bal * (apr / 100 / 12) + bal * 0.02));
const paymentOf = (a) => (a.payment > 0 ? a.payment : defaultPayment(Math.abs(a.balance), a.rate || 0));
const monthYear = (mFromNow) =>
  new Date(new Date().getFullYear(), new Date().getMonth() + mFromNow, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

function payoffSchedule() {
  const rows = state.accounts
    .filter((a) => a.type === 'card' || a.type === 'loan')
    .map((a) => ({ id: a.id, name: a.name, institution: a.institution, bal: Math.abs(a.balance), apr: a.rate || 0, pay: paymentOf(a) }))
    .map((d) => {
      let bal = d.bal;
      let m = 0;
      let interest = 0;
      const ok = d.pay > (d.bal * d.apr) / 100 / 12;
      while (bal > 0 && m < 600) {
        const i = (bal * d.apr) / 100 / 12;
        interest += i;
        bal = bal + i - d.pay;
        m++;
      }
      return { ...d, months: bal > 0 ? null : m, interest: Math.round(interest * 100) / 100, ok };
    });
  const agg = [];
  for (let m = 0; m <= 12; m++) {
    let total = 0;
    for (const r of rows) {
      let bal = r.bal;
      for (let i = 0; i < m; i++) bal = Math.max(0, bal + (bal * r.apr) / 100 / 12 - r.pay);
      total += bal;
    }
    agg.push(total);
  }
  return { rows, agg };
}

const goalPct = (g) => (g.target > 0 ? Math.min(100, Math.round((g.saved / g.target) * 100)) : 0);
const goalEta = (g) => {
  if (g.saved >= g.target && g.target > 0) return 'Goal reached';
  if (!g.monthly) return 'Add a monthly amount to see a date';
  return 'On track for ' + monthYear(Math.ceil((g.target - g.saved) / g.monthly));
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

const DEFAULT_PROFILE_NAME = 'My finances';
const dataBadge = () => 'My data';
const initialsOf = (name) =>

function applyUserName() {

  const el = document.querySelector('#user-name');

  if (av) av.textContent = initialsOf(state.userName || DEFAULT_PROFILE_NAME);
}

/* ---------- Charts (inline SVG) ---------- */
function areaChart(values, { stroke = 'var(--color-primary)', id }) {
  const W = 640, H = 190, PAD = 10;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || Math.abs(max) || 1;
  const x = (i) => PAD + (i * (W - PAD * 2)) / (values.length - 1);
  const y = (v) => H - 18 - ((v - min) / range) * (H - 42);
  const pts = values.map((v, i) => [x(i), y(v)]);
  const line = pts.map(([px, py], i) => `${i === 0 ? 'M' : 'L'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
  const fill = `${line}L${(W - PAD).toFixed(1)},${H - 8}L${PAD},${H - 8}Z`;
  const grid = [0.25, 0.5, 0.75]
    .map((f) => `<line x1="${PAD}" x2="${W - PAD}" y1="${(H - 18 - f * (H - 42)).toFixed(1)}" y2="${(H - 18 - f * (H - 42)).toFixed(1)}" stroke="var(--color-divider)" stroke-width="1" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>`)
    .join('');
  const last = pts[pts.length - 1];
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend chart">
    <defs><linearGradient id="grad-${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${stroke}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${stroke}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${grid}
    <path d="${fill}" fill="url(#grad-${id})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${stroke}" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* Net-worth history: 12 months ending at current net worth */
function netWorthSeries(current) {
  const factors = [0.882, 0.889, 0.897, 0.893, 0.906, 0.918, 0.911, 0.927, 0.938, 0.944, 0.953, 0.968, 1];
  return factors.map((f) => current * f);
}

/* 12-month cash projection with monthly compounding at current APYs */
function cashProjectionSeries() {
  const series = [];
  for (let m = 0; m <= 12; m++) {
    let total = 0;
    for (const a of state.accounts) {
      if (a.type === 'cash') total += a.balance * Math.pow(1 + a.rate / 100 / 12, m);
    }
    series.push(total);
  }
  return series;
}

/* ---------- Render: allocation analysis ---------- */
function renderAllocation() {
  const t = totals();
  const byGroup = GROUPS.map((g) => {
    const rows = state.accounts.filter((a) => a.type === g.type && isInNetWorth(a));
    const bal = rows.reduce((s, a) => s + a.balance, 0);
    return { ...g, bal, count: rows.length };
  }).filter((g) => g.count > 0 || Math.abs(g.bal) > 0);

  const totalAbs = byGroup.reduce((s, g) => s + Math.abs(g.bal), 0) || 1;
  const assetsOnly = byGroup.filter((g) => g.bal > 0);
  const assetsSum = assetsOnly.reduce((s, g) => s + g.bal, 0) || 1;

  const colorMap = {
    green: 'var(--color-primary)',
    red: 'var(--color-negative)',
    blue: 'var(--color-blue)',
    gold: 'var(--color-gold)',
    slate: 'var(--color-text-muted)',
  };

  const bars = byGroup
    .map((g) => {
      const pct = ((Math.abs(g.bal) / totalAbs) * 100).toFixed(1);
      const assetPct = g.bal > 0 ? ((g.bal / assetsSum) * 100).toFixed(1) : null;
      return `
      <div class="alloc-row">
        <div class="alloc-label">
          <span class="dot" style="background:${colorMap[g.color] || 'var(--color-text-muted)'}"></span>
          <div>
            <div class="snap-name">${esc(g.title)}</div>
            <div class="snap-count">${g.count} account${g.count === 1 ? '' : 's'}${assetPct ? ` · ${assetPct}% of assets` : ''}</div>
          </div>
        </div>
        <div class="alloc-bar-wrap">
          <div class="alloc-bar" style="width:${pct}%;background:${colorMap[g.color] || 'var(--color-text-muted)'}"></div>
        </div>
        <div class="alloc-val num">${fmtMoney(g.bal)} <span class="alloc-pct">${pct}%</span></div>
      </div>`;
    })
    .join('');

  const liqBreakdown = LIQ_ORDER.map((k) => {
    const rows = state.accounts.filter((a) => hasLiquidity(a) && liqOf(a) === k && isInNetWorth(a));
    const bal = rows.reduce((s, a) => s + a.balance, 0);
    return { key: k, label: LIQ[k], bal, count: rows.length };
  }).filter((x) => x.count > 0);

  const liqTotal = liqBreakdown.reduce((s, x) => s + Math.abs(x.bal), 0) || 1;
  const liqBars = liqBreakdown
    .map((x) => {
      const pct = ((Math.abs(x.bal) / liqTotal) * 100).toFixed(1);
      return `
      <div class="alloc-row">
        <div class="alloc-label"><div class="snap-name">${esc(x.label)}</div><div class="snap-count">${x.count} account${x.count === 1 ? '' : 's'}</div></div>
        <div class="alloc-bar-wrap"><div class="alloc-bar" style="width:${pct}%;background:var(--color-primary)"></div></div>
        <div class="alloc-val num">${fmtMoney(x.bal)} <span class="alloc-pct">${pct}%</span></div>
      </div>`;
    })
    .join('');

  viewRoot.innerHTML = `
    ${pageHead('Allocation', '<span>How your net-worth accounts are distributed</span>', `<span class="badge-demo">${dataBadge()}</span>`)}
    <div class="summary-strip">
      <div class="summary-card"><div class="s-label">Net worth</div><div class="s-value num">${fmtMoney(t.netWorth)}</div><div class="s-foot">Included accounts only</div></div>
      <div class="summary-card"><div class="s-label">Assets</div><div class="s-value pos num">${fmtMoney(t.assets)}</div><div class="s-foot">Positive balances</div></div>
      <div class="summary-card"><div class="s-label">Debt</div><div class="s-value neg num">${fmtMoney(t.debt)}</div><div class="s-foot">Cards &amp; loans</div></div>
      <div class="summary-card"><div class="s-label">Receivables</div><div class="s-value num">${fmtMoney(t.receivables)}</div><div class="s-foot">Pending inflows</div></div>
    </div>
    <div class="dash-grid">
      <div class="card">
        <div class="card-head"><div><div class="card-title">By account type</div><div class="card-sub">Only accounts marked “In NW”</div></div></div>
        ${bars || '<div class="empty-note">No accounts included in net worth yet.</div>'}
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">By liquidity</div><div class="card-sub">How quickly you can access the money</div></div></div>
        ${liqBars || '<div class="empty-note">No liquid / semi-liquid accounts yet.</div>'}

}

/* ---------- Recalculate on rate edit (no re-render, keeps focus) ---------- */
function recalc(changedId) {
  const t = totals();
  const a = state.accounts.find((x) => x.id === changedId);
  if (a) {
    const annual = annualInterest(a);
    const iMain = document.querySelector(`[data-interest="${a.id}"]`);
    if (iMain) {
      if (a.type === 'cash') {
        iMain.textContent = fmtMoney(annual);
        const iSub = document.querySelector(`[data-interest-monthly="${a.id}"]`);
        if (iSub) iSub.textContent = `${fmtMoney(annual / 12)} / mo`;
      } else {
        iMain.textContent = `−${fmtMoney(annual)}`;
      }
    }
  }
  /* Group headers */
  for (const g of GROUPS) {
    const rows = state.accounts.filter((x) => x.type === g.type);
    const el = document.querySelector(`[data-group-balance="${g.type}"]`);
    if (el) el.textContent = fmtMoney(rows.reduce((s, x) => s + x.balance, 0));
    const gi = document.querySelector(`[data-group-interest="${g.type}"]`);
    if (gi) {
      const interest = rows.reduce((s, x) => s + annualInterest(x), 0);
      gi.textContent = g.type === 'cash' ? fmtMoney(interest) : `−${fmtMoney(interest)}`;
    }
  }
  /* Bindings shared between views */
  const set = (sel, val) => { const el = document.querySelector(sel); if (el) el.textContent = val; };
  set('[data-bind="earned"]', fmtMoney(t.earned));
  set('[data-bind="earned-monthly"]', fmtMoney(t.earned / 12) + (state.view === 'accounts' ? ' per month' : ''));
  set('[data-bind="cost"]', fmtMoney(t.cost));
  set('[data-bind="net-interest"]', fmtSigned(t.netInterest));
  const netEl = document.querySelector('[data-bind="net-interest"]');
  if (netEl) netEl.classList.toggle('pos', t.netInterest >= 0), netEl.classList.toggle('neg', t.netInterest < 0);
  set('[data-bind="blended"]', `${(t.cash ? (t.earned / t.cash) * 100 : 0).toFixed(2)}%`);
  /* Dashboard-only chart */
  const projWrap = document.querySelector('.chart-wrap');
  if (state.view === 'dashboard' && projWrap) {
    const proj = cashProjectionSeries();
    projWrap.innerHTML = areaChart(proj, { id: 'proj' }) + `
      <div class="chart-legend"><span>Today: <span class="num" data-bind="cash-today">${fmtMoney(proj[0])}</span></span><span>In 12 mo: <span class="num" data-bind="cash-12mo">${fmtMoney(proj[12])}</span> <span style="color:var(--color-primary);font-weight:600">(+<span data-bind="proj-gain">${fmtMoney(proj[12] - proj[0])}</span>)</span></span></div>`;
  }
}

/* ---------- Routing & events ---------- */
function render() {
  switch (state.view) {
    case 'dashboard': renderDashboard(); break;
    case 'accounts': renderAccounts(); break;
    case 'interest': renderInterest(); break;
    case 'goals': renderGoals(); break;
    case 'payoff': renderPayoff(); break;
    case 'allocation': renderAllocation(); break;
    case 'stats': renderStats(); break;
    default: renderPlaceholder(state.view.charAt(0).toUpperCase() + state.view.slice(1));
  }
  document.querySelectorAll('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.view === state.view));
  applyUserName();
  document.querySelectorAll('.bn-item').forEach((n) => n.classList.toggle('active', n.dataset.view === state.view));
  const tt = $('#theme-toggle');
  if (tt) tt.innerHTML = themeBtnHTML();
  viewRoot.parentElement.scrollTop = 0;
}

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-view]');
  if (nav) { state.view = nav.dataset.view; render(); return; }

  const link = e.target.closest('[data-view-link]');
  if (link) { state.view = link.dataset.viewLink; render(); return; }

  if (e.target.closest('#btn-add-account')) { openModal(); return; }

  if (e.target.closest('#btn-add-goal')) {
    ['f-goal-name', 'f-goal-target', 'f-goal-saved', 'f-goal-monthly'].forEach((id) => { document.getElementById(id).value = ''; });
    document.getElementById('goal-overlay').hidden = false;
    document.getElementById('f-goal-name').focus();
    return;
  }
  if (e.target.closest('#goal-close') || e.target.closest('#goal-cancel') || e.target.id === 'goal-overlay') {
    document.getElementById('goal-overlay').hidden = true; return;
  }

  if (e.target.closest('#modal-close') || e.target.closest('#modal-cancel') || e.target.id === 'modal-overlay') {
    closeModal(); return;
  }

  const del = e.target.closest('[data-delete]');
  if (del) {
    const id = del.dataset.delete;
    const a = state.accounts.find((x) => x.id === id);
    if (a && confirm(`Remove "${a.name}"?`)) {
      state.accounts = state.accounts.filter((x) => x.id !== id);
      render();
      updateNavCount();
      scheduleSave();
    }
    return;
  }

  const gdel = e.target.closest('[data-goal-delete]');
  if (gdel) {
    const id = gdel.dataset.goalDelete;
    const g = state.goals.find((x) => x.id === id);
    if (g && confirm(`Remove goal "${g.name}"?`)) {
      state.goals = state.goals.filter((x) => x.id !== id);
      render();
      scheduleSave();
    }
    return;
  }

  if (e.target.closest('#btn-clear-all, #btn-clear-all-settings')) {
    if (confirm('Clear all financial data? This removes your accounts and goals, but keeps your name and settings.')) {
      state.accounts = [];
      state.goals = [];
      render();
      updateNavCount();
      scheduleSave();
      closeModal();
      closeSettings();
    }
    return;
  }
  if (e.target.closest('#btn-settings')) { openSettings(); return; }
  if (e.target.closest('#settings-close') || e.target.id === 'settings-overlay') { closeSettings(); return; }
  if (e.target.closest('#btn-export')) { exportData(); return; }
  if (e.target.closest('#btn-import')) { document.getElementById('import-file').click(); return; }
  if (e.target.closest('#theme-toggle')) { toggleTheme(); return; }
});

/* Rate input — live recalc without re-render (keeps typing focus) */
document.addEventListener('input', (e) => {
  const input = e.target.closest('[data-rate-for]');
  if (!input) return;
  const a = state.accounts.find((x) => x.id === input.dataset.rateFor);
  if (!a) return;
  const v = parseFloat(input.value);
  a.rate = Number.isFinite(v) ? clampRate(v) : 0;
  recalc(a.id);
  scheduleSave();
});

/* Balance input — live recalc + save */
document.addEventListener('input', (e) => {
  const input = e.target.closest('[data-balance-for]');
  if (!input) return;
  const a = state.accounts.find((x) => x.id === input.dataset.balanceFor);
  if (!a) return;
  const v = parseFloat(input.value);
  a.balance = Number.isFinite(v) ? v : 0;
  input.classList.toggle('negative', a.balance < 0);
  recalc(a.id);
  scheduleSave();
});

  if (el) el.hidden = true;
}

function openModal() {
  overlay.hidden = false;
  $('#f-name').focus();
}
function closeModal() {
  overlay.hidden = true;
  $('#add-account-form').reset();
  syncRateField();
}

function syncRateField() {
  const type = $('#f-type').value;
  const rateInput = $('#f-rate');
  const field = $('#f-rate-field');
  const label = $('#f-rate-label');
  const hint = $('#f-rate-hint');
  const liqField = $('#f-liquidity-field');
  const liqSel = $('#f-liquidity');
  const debtType = type === 'card' || type === 'loan';
  liqField.style.display = debtType ? 'none' : '';
  if (!debtType) liqSel.value = LIQ_DEFAULT[type] || 'locked';
  if (type === 'inv' || type === 'crypto' || type === 'property' || type === 'other' || type === 'receivable') {
    label.textContent = type === 'receivable' ? 'Rate (N/A)' : 'Current APY (%)';
    rateInput.disabled = true;
    rateInput.value = '';
    hint.textContent = type === 'receivable'
      ? 'Receivables have no fixed rate — track expected inflow here.'
      : 'This account type tracks the market — no fixed rate.';
  } else {
    label.textContent = type === 'cash' ? 'Current APY (%)' : 'Current APR (%)';
    rateInput.disabled = false;
    hint.textContent = 'Estimated interest updates instantly as you type.';
  }
  field.style.opacity = (type === 'inv' || type === 'receivable') ? '0.55' : '1';
}

$('#f-type').addEventListener('change', syncRateField);

document.addEventListener('change', (e) => {
  if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) {
    importData(e.target.files[0]);
    return;
  }
  const liq = e.target.closest('[data-liquidity-for]');
  if (liq) {
    const a = state.accounts.find((x) => x.id === liq.dataset.liquidityFor);
    if (a) {
      a.liquidity = liq.value;
      scheduleSave();
    }
    return;
  }
  const nw = e.target.closest('[data-nw-for]');
  if (nw) {
    const a = state.accounts.find((x) => x.id === nw.dataset.nwFor);
    if (a) {
      a.inNetWorth = nw.checked;
      render();
      scheduleSave();
    }
    return;
  }
  const gs = e.target.closest('[data-goal-saved-for]');
  if (gs) {
    const g = state.goals.find((x) => x.id === gs.dataset.goalSavedFor);
    if (g) {
      const v = parseFloat(gs.value);
      g.saved = Number.isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : 0;
      render();
      scheduleSave();
    }
    return;
  }
  const gm = e.target.closest('[data-goal-monthly-for]');
  if (gm) {
    const g = state.goals.find((x) => x.id === gm.dataset.goalMonthlyFor);
    if (g) {
      const v = parseFloat(gm.value);
      g.monthly = Number.isFinite(v) && v >= 0 ? Math.round(v) : 0;
      render();
      scheduleSave();
    }
    return;
  }
  const pm = e.target.closest('[data-payment-for]');
  if (pm) {
    const a = state.accounts.find((x) => x.id === pm.dataset.paymentFor);
    if (a) {
      const v = parseFloat(pm.value);
      a.payment = Number.isFinite(v) && v >= 0 ? Math.round(v) : 0;
      render();
      scheduleSave();
    }
  }
});

$('#add-account-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('#f-name').value.trim();
  const institution = $('#f-institution').value.trim() || '—';
  const type = $('#f-type').value;
  const balance = parseFloat($('#f-balance').value);
  const rate = parseFloat($('#f-rate').value);
  if (!name || !Number.isFinite(balance)) return;
  const signedBalance = type === 'card' || type === 'loan' ? -Math.abs(balance) : Math.abs(balance);
  const acc = {
    id: 'x' + Date.now().toString(36),
    name,
    institution,
    type,
    balance: signedBalance,
    inNetWorth: true,
  };
  if (type === 'cash' || type === 'card' || type === 'loan') acc.rate = Number.isFinite(rate) ? clampRate(rate) : 0;
  if (type !== 'card' && type !== 'loan') acc.liquidity = $('#f-liquidity-field').style.display === 'none' ? (LIQ_DEFAULT[type] || 'locked') : ($('#f-liquidity').value || LIQ_DEFAULT[type] || 'locked');
  state.accounts.push(acc);
  closeModal();
  if (state.view !== 'accounts') state.view = 'accounts';
  render();
  updateNavCount();
  scheduleSave();
});

$('#goal-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('#f-goal-name').value.trim();
  const target = parseFloat($('#f-goal-target').value);
  if (!name || !Number.isFinite(target) || target <= 0) return;
  const saved = parseFloat($('#f-goal-saved').value);
  const monthly = parseFloat($('#f-goal-monthly').value);
  state.goals.push({
    id: 'g' + Date.now().toString(36),
    name,
    target: Math.round(target * 100) / 100,
    saved: Number.isFinite(saved) && saved > 0 ? Math.round(saved * 100) / 100 : 0,
    monthly: Number.isFinite(monthly) && monthly > 0 ? Math.round(monthly) : 0,
  });
  document.getElementById('goal-overlay').hidden = true;
  if (state.view !== 'goals') state.view = 'goals';
  render();
  scheduleSave();
});

$('#settings-form').addEventListener('submit', (e) => {
  e.preventDefault();
  state.userName = $('#f-username').value.trim().slice(0, 40);
  applyUserName();
  render();
  scheduleSave();
  closeSettings();
});

function updateNavCount() {
  const chip = document.querySelector('[data-testid="nav-accounts-count"]');
  if (chip) chip.textContent = state.accounts.length;
}

/* ---------- Theme ---------- */
function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  const tt = $('#theme-toggle');
  if (tt) {
    tt.innerHTML = themeBtnHTML();
    tt.setAttribute('aria-label', `Switch to ${next === 'dark' ? 'light' : 'dark'} mode`);
  }
  scheduleSave();
}

(function initTheme() {
  const root = document.documentElement;
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
})();

/* ---------- Boot ---------- */
(async function boot() {
  await loadState();
  render();
  updateNavCount();
})();

</script>
  </body>
</html>
